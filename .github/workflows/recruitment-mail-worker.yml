name: Recruitment mail worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
    # Resend resets its daily allowance at 00:00 UTC (19:00 in Lima).
    - cron: '0 0 * * *'

permissions: {}
concurrency:
  group: recruitment-mail-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process durable outbox and inactive drafts
        env:
          RECRUITMENT_BASE_URL: ${{ vars.RECRUITMENT_BASE_URL }}
          CRON_SECRET: ${{ secrets.RECRUITMENT_CRON_SECRET }}
        run: |
          if [ -z "$RECRUITMENT_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Recruitment worker is inactive: deployment settings are pending."
            exit 0
          fi
          case "$RECRUITMENT_BASE_URL" in
            https://*) ;;
            *) echo "The configured deployment URL must use HTTPS."; exit 1 ;;
          esac
          for batch in 1 2 3; do
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${RECRUITMENT_BASE_URL%/}/api/recruitment/admin/process-emails" \
              --output /tmp/recruitment-mail-result.json
            state=$(node -e 'const r = JSON.parse(require("fs").readFileSync("/tmp/recruitment-mail-result.json", "utf8")); console.log(r.skipped || r.failed > 0 || r.processed === 0 || r.remaining === 0 ? "stop" : "continue")')
            if [ "$state" = "stop" ]; then break; fi
          done
